[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightline"
version = "0.1.0"
description = "Governed flight-test telemetry pipeline: high-volume ingest, governance tagging, Kubernetes-native autoscaling, and threshold paging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "pyarrow>=16",
    "boto3>=1.34",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pyyaml>=6",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "fakeredis>=2.23",
    "moto[s3]>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "boto3-stubs[s3]",
]

[project.scripts]
flightline = "flightline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: requires the docker compose stack (make e2e)"]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["flightline"]
branch = true
omit = ["src/flightline/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PL"]
# PLC0415: role-specific imports are deliberately lazy so each process loads only what it runs.
ignore = ["PLR0913", "PLR2004", "S101", "S311", "S104", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "PT018", "ASYNC240"]
"src/flightline/ingest/app.py" = ["PLR0915"]  # route closures in an app factory
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "fakeredis.*", "moto.*"]
ignore_missing_imports = true
