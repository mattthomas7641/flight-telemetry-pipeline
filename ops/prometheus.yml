global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: ingest
    metrics_path: /metrics/
    static_configs: [{ targets: ["ingest:8080"] }]
  - job_name: writer
    # One A record per replica, so every writer is scraped.
    dns_sd_configs: [{ names: ["writer"], type: A, port: 9100 }]
  - job_name: alerter
    static_configs: [{ targets: ["alerter:9100"] }]
